# Publie les six paquets sur npm quand on pousse un tag v*, ex. : git tag v0.7.0 && git push origin v0.7.0
# Publication de confiance (trusted publishing) : npm reconnaît ce workflow par OIDC, sans jeton à stocker.
# Prérequis, une fois par paquet sur npmjs.com : Settings > Trusted Publisher > GitHub Actions,
# organisation « cybexai », dépôt « afroicons », workflow « release.yml ».
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      # Node 24 embarque npm 11, nécessaire à la publication de confiance (npm 11.5.1 ou plus récent).
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm --version
      - name: La version du tag correspond aux paquets
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME, mais package.json est en $v : mettez la version à jour avant de taguer."; exit 1; }
          for d in packages/afroicons packages/afroicons-react packages/afroicons-ui packages/afroicons-angular packages/afroicons-mui packages/afroicons-antd; do
            pv="$(node -p "require('./$d/package.json').version")"; [ "$pv" = "$v" ] || { echo "$d est en $pv, attendu $v"; exit 1; }
          done
      - run: npm ci
      - run: cp LICENSE packages/afroicons-angular/
      - run: npm test
      - run: cp LICENSE packages/afroicons/ && cp LICENSE packages/afroicons-react/ && cp LICENSE packages/afroicons-ui/
      # Provenance ajoutée automatiquement par la publication de confiance. Une version déjà publiée
      # (première publication faite à la main, relance du workflow) n'arrête pas la suite.
      - run: npm publish --access public || npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version
        working-directory: packages/afroicons
      - run: npm publish --access public || npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version
        working-directory: packages/afroicons-react
      - run: npm publish --access public || npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version
        working-directory: packages/afroicons-ui
      - run: npm publish --access public || npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version
        working-directory: packages/afroicons-angular/dist
      - run: cp LICENSE packages/afroicons-mui/ && cp LICENSE packages/afroicons-antd/
      - run: npm publish --access public || npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version
        working-directory: packages/afroicons-mui
      - run: npm publish --access public || npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version
        working-directory: packages/afroicons-antd
