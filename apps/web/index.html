<!DOCTYPE html>
<html lang="fr" data-mode="light" data-city="douala">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Applique thème, ambiance et langue avant le premier affichage (évite le flash du thème clair).
  (function () {
    var h = document.documentElement, get = function (k) { try { return JSON.parse(localStorage.getItem("afroicons:" + k)); } catch (e) { return null; } };
    var m = get("theme");
    if (m !== "light" && m !== "dark") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    h.dataset.mode = m;
    var c = get("city"); if (typeof c === "string" && /^[a-z]+$/.test(c)) h.dataset.city = c;
    var l = get("lang"); if (l === "fr" || l === "en") h.lang = l;
  })();
</script>
<title>Afroicons — des icônes qui racontent l'Afrique</title>
<meta name="description" content="325 icônes SVG libres qui racontent l'Afrique, au trait et remplies : paysages, faune, musique, symboles adinkra, cuisine, vie quotidienne, architecture, et des icônes d'interface compatibles Lucide. React, Angular et SVG, en français et en anglais.">
<link rel="canonical" href="https://afroicons.org/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://afroicons.org/">
<meta property="og:title" content="Afroicons — des icônes qui racontent l'Afrique">
<meta property="og:description" content="325 icônes SVG libres, au trait et remplies : baobab, djembé, moto-taxi, mobile money, case obus… Pour React, Angular et SVG.">
